<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poetry | 1000 Nights</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="index.html" class="back-link">← Back to Library</a>
    
    <h1>Tonight's Poem</h1>

    <div class="controls">
        <button id="refresh-btn" class="btn">Get New Random Poem</button>
    </div>

    <div id="poem-display" class="poem-container">
        <p class="loading">Sourcing a masterpiece...</p>
    </div>

    <div class="manual-entry">
        <h3>Read something else?</h3>
        <p>If you read a poem elsewhere, log it here:</p>
        <input type="text" id="manual-title" placeholder="Title of the poem">
        <button id="manual-btn" class="btn">Mark as Read</button>
    </div>

    <script src="scripts/poem.js"></script>
</body>
</html>
